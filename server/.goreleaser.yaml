version: 2

# 固定项目名，保证 dist/ 下构建目录为 gostc-open_<target>，与 Dockerfile 中的 COPY 路径一致
project_name: gostc-open

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    targets:
      - freebsd_386
      - freebsd_amd64
      - darwin_amd64
      - darwin_arm64
      - linux_arm_7
      - linux_arm64
      - linux_amd64
      - linux_amd64_v3
      - windows_arm64
      - windows_amd64
      - windows_amd64_v3
    ldflags:
      - -s
      - -w
    binary: >-
      server
    main: ./main.go
archives:
  - format: tar.gz
    name_template: "server_{{ .Target }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE

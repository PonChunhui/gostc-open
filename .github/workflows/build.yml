name: Build

on:
  push:
    tags:
      - 'v*'
      - '*beta*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.12)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build frontend
        working-directory: ./web
        run: npm run build

      - name: Compress dist directory
        working-directory: ./web
        run: zip -r dist.zip dist

      - name: Move dist.zip to backend directory
        run: mv web/dist.zip server/web/dist.zip

      - name: Build backend
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --timeout 300m --parallelism=2
          workdir: ./server

      - name: Upload server release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ./server/dist/*.tar.gz
            ./server/dist/*.zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare image tags
        id: docker_meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          IMAGE="${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKER_USERNAME }}/gostc-admin"
          TAGS="${IMAGE}:${TAG}"
          # 仅稳定版本（无 -beta/-rc 等后缀）追加 latest 标签
          if [[ "${TAG}" != *-* ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}

  gostc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Build client
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --timeout 300m --parallelism=2
          workdir: ./client

      - name: Upload client release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ./client/dist/*.tar.gz
            ./client/dist/*.zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare image tags
        id: docker_meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          IMAGE="${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKER_USERNAME }}/gostc"
          TAGS="${IMAGE}:${TAG}"
          # 仅稳定版本（无 -beta/-rc 等后缀）追加 latest 标签
          if [[ "${TAG}" != *-* ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}

  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod

      - name: Build proxy
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --timeout 300m --parallelism=2
          workdir: ./proxy

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ./proxy/dist/*.tar.gz
            ./proxy/dist/*.zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare image tags
        id: docker_meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          IMAGE="${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKER_USERNAME }}/gostc-proxy"
          TAGS="${IMAGE}:${TAG}"
          # 仅稳定版本（无 -beta/-rc 等后缀）追加 latest 标签
          if [[ "${TAG}" != *-* ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}

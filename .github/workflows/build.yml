name: Build

on:
  push:
    tags:
      - 'v*'
      - '*beta*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.12)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build frontend
        working-directory: ./web
        run: npm run build

      - name: Compress dist directory
        working-directory: ./web
        run: zip -r dist.zip dist

      - name: Move dist.zip to backend directory
        run: mv web/dist.zip server/web/dist.zip

      - name: Build backend
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --timeout 300m --parallelism=2
          workdir: ./server

      - name: Upload server release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ./server/dist/*.tar.gz
            ./server/dist/*.zip

  gostc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Build client
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --timeout 300m --parallelism=2
          workdir: ./client

      - name: Upload client release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ./client/dist/*.tar.gz
            ./client/dist/*.zip

  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod

      - name: Build proxy
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --timeout 300m --parallelism=2
          workdir: ./proxy

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ./proxy/dist/*.tar.gz
            ./proxy/dist/*.zip
